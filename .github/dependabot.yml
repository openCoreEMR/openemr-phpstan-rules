# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor Composer dependencies
- package-ecosystem: composer
  cooldown:
    exclude:
    - openCoreEMR/*
    - opencoreemr/*
  directory: /
  schedule:
    interval: daily
  labels:
  - dependencies
  - composer
  commit-message:
    prefix: fix(deps)
    prefix-development: chore(deps-dev)
  ignore:
  # This package supports PHP ^8.2; PHPUnit 12 requires PHP 8.3 and PHPUnit 13 requires PHP 8.4.
  - dependency-name: phpunit/phpunit
    versions:
    - '>=12.0'
  # Monitor GitHub Actions
- package-ecosystem: github-actions
  cooldown:
    exclude:
    - openCoreEMR/*
    - opencoreemr/*
  directory: /
  schedule:
    interval: daily
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: chore(ci)
