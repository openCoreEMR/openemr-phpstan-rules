# Calls the shared actionlint workflow. Do not add `paths:` to `pull_request`;
# it breaks promotion to a required check (skipped run = missing check =
# auto-merge stall). Path filtering on `push` is fine.
name: actionlint

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/**
    - .github/actions/**
  pull_request:
    branches: [main]

jobs:
  actionlint:
    uses: openCoreEMR/github-workflows-public/.github/workflows/actionlint.yml@1.0.1
    permissions:
      contents: read
